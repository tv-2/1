        function parseKeys(text){

            const clearKeys={};

            const lines=text.split(/\r?\n/);

            for(let line of lines){

                line=line.trim();

                if(line==="") continue;

                line=line.replace("=",":");

                const parts=line.split(":");

                if(parts.length<2) continue;

                const kid=parts[0].trim();

                const key=parts.slice(1).join(":").trim();

                if(kid!="" && key!=""){

                    clearKeys[kid]=key;

                }

            }

            return clearKeys;

        }

				function cargarArchivoM3U(event){

    const archivo=event.target.files[0];

    if(!archivo) return;

    const lector=new FileReader();

    lector.onload=function(e){

        interpretarM3U(e.target.result);

    };

    lector.readAsText(archivo);

}

function interpretarM3U(texto){

    canales=[];

    const lineas=texto.split(/\r?\n/);

    let nombre="";

    for(let linea of lineas){

        linea=linea.trim();

        if(linea.startsWith("#EXTINF")){

            const partes=linea.split(",");

            nombre=partes.length>1 ? partes[1] : "Canal";

        }

        else if(linea.startsWith("http")){

            canales.push({

                nombre:nombre,

                url:linea

            });

        }

    }

    mostrarCanales(canales);

}

function mostrarCanales(lista){

    listaCanales.innerHTML="";

    lista.forEach((canal,index)=>{

        const option=document.createElement("option");

        option.value=index;

        option.text=canal.nombre;

        listaCanales.appendChild(option);

    });

}

    document.getElementById("stream_url").value=

		        function cargarCalidades(){

            if(!player) return;

            const tracks=player.getVariantTracks();

            qualitySelect.innerHTML="";

            const auto=document.createElement("option");

            auto.value="AUTO";

            auto.text="Automática";

            qualitySelect.appendChild(auto);

            const resoluciones=[];

            tracks.forEach(track=>{

                if(track.height && !resoluciones.includes(track.height)){

                    resoluciones.push(track.height);

                }

            });

            resoluciones.sort((a,b)=>b-a);

            resoluciones.forEach(height=>{

                const option=document.createElement("option");

                option.value=height;

                option.text=height+"p";

                qualitySelect.appendChild(option);

            });

            qualitySelect.onchange=function(){

                if(this.value==="AUTO"){

                    player.configure({

                        abr:{
                            enabled:true
                        }

                    });

                    return;

                }

                player.configure({

                    abr:{
                        enabled:false
                    }

                });

                const tracks=player.getVariantTracks();

                const selected=tracks.find(

                    t=>t.height==this.value

                );

                if(selected){

                    player.selectVariantTrack(

                        selected,

                        true

                    );

                }

            };

        }

        function actualizarInformacion(){

            if(!player) return;

            const tracks=player.getVariantTracks();

            const active=tracks.find(

                t=>t.active

            );

            if(!active) return;

            infoResolution.innerHTML=

                active.width+

                " x "+

                active.height;

            infoCodec.innerHTML=

                active.videoCodec ||

                "-";

            if(active.bandwidth){

                const mbps=(

                    active.bandwidth/1000000

                ).toFixed(2);

                infoCodec.innerHTML+=

                    " | "+

                    mbps+

                    " Mbps";

            }

        }

        function iniciarMonitor(){

            setInterval(()=>{

                if(!player) return;

                actualizarInformacion();

            },3000);

        }        function cargarAudios(){

            if(!player) return;

            const tracks=player.getAudioLanguages();

            audioSelect.innerHTML="";

            if(tracks.length===0){

                const option=document.createElement("option");

                option.text="Sin pistas";

                option.value="";

                audioSelect.appendChild(option);

                return;

            }

            tracks.forEach(language=>{

                const option=document.createElement("option");

                option.value=language;

                option.text=language.toUpperCase();

                audioSelect.appendChild(option);

            });

            const actual=player.getConfiguration().preferredAudioLanguage;

            if(actual){

                audioSelect.value=actual;

            }

            audioSelect.onchange=function(){

                player.selectAudioLanguage(this.value);

                infoAudio.innerHTML=this.value.toUpperCase();

            };

        }

        function cargarSubtitulos(){

            if(!player) return;

            subtitleSelect.innerHTML="";

            const off=document.createElement("option");

            off.value="OFF";

            off.text="Desactivados";

            subtitleSelect.appendChild(off);

            const tracks=player.getTextTracks();

            tracks.forEach(track=>{

                const option=document.createElement("option");

                option.value=track.language;

                option.text=track.language.toUpperCase();

                subtitleSelect.appendChild(option);

            });

            subtitleSelect.onchange=function(){

                if(this.value==="OFF"){

                    player.setTextTrackVisibility(false);

                    infoSubtitle.innerHTML="Desactivados";

                    return;

                }

                player.setTextTrackVisibility(true);

                player.selectTextLanguage(this.value);

                infoSubtitle.innerHTML=this.value.toUpperCase();

            };

        }

        function actualizarAudioActivo(){

            if(!player) return;

            const tracks=player.getVariantTracks();

            const active=tracks.find(track=>track.active);

            if(active){

                infoAudio.innerHTML=active.language.toUpperCase();

            }

        }

        function actualizarSubtituloActivo(){

            if(!player) return;

            const tracks=player.getTextTracks();

            const active=tracks.find(track=>track.active);

            if(active){

                infoSubtitle.innerHTML=active.language.toUpperCase();

            }else{

                infoSubtitle.innerHTML="Desactivados";

            }

            video.addEventListener("timeupdate",()=>{

            video.addEventListener("loadedmetadata",()=>{

            });

                document.getElementById("estadoPlayer").innerHTML="Finalizado";

            });

        }

function inicializarControles(){

    btnPlayPause.onclick=function(){

        if(video.paused)

            video.play();

        else

            video.pause();

    };

    btnMute.onclick=function(){

        video.muted=!video.muted;

    };

    btnFullscreen.onclick=function(){

        if(document.fullscreenElement){

            document.exitFullscreen();

        }

        else{

            video.requestFullscreen();

        }

    };

    btnPiP.onclick=async function(){

        if(document.pictureInPictureEnabled){

            try{

                if(document.pictureInPictureElement){

                    await document.exitPictureInPicture();

                }

                else{

                    await video.requestPictureInPicture();

                }

            }

            catch(e){

                console.log(e);

            }

        }

    };

    speedControl.onchange=function(){

        video.playbackRate=parseFloat(this.value);

    };

}
document.addEventListener(

    "keydown",

    function(e){

        if(e.target.tagName==="INPUT" ||

           e.target.tagName==="TEXTAREA")

            return;

        switch(e.key){

            case " ":

                e.preventDefault();

                if(video.paused)

                    video.play();

                else

                    video.pause();

            break;

            case "ArrowRight":

                video.currentTime+=10;

            break;

            case "ArrowLeft":

                video.currentTime-=10;

            break;

            case "ArrowUp":

                video.volume=Math.min(

                    video.volume+0.1,

                    1

                );

            break;

            case "ArrowDown":

                video.volume=Math.max(

                    video.volume-0.1,

                    0

                );

            break;

            case "f":

            case "F":

                btnFullscreen.click();

            break;

        }

    }

const STORAGE_HISTORY="imperio_history";

const STORAGE_FAVORITES="imperio_favorites";

let historial=[];

let favoritos=[];
let canales=[];

const listaCanales=document.getElementById("listaCanales");

const buscarCanal=document.getElementById("buscarCanal");

const btnPlayPause=document.getElementById("btnPlayPause");

const btnMute=document.getElementById("btnMute");

const btnFullscreen=document.getElementById("btnFullscreen");

const btnPiP=document.getElementById("btnPiP");

const speedControl=document.getElementById("speedControl");

function cargarHistorial(){

    historial=JSON.parse(

        localStorage.getItem(STORAGE_HISTORY)

        ||"[]"

    );

}

function guardarHistorial(){

    localStorage.setItem(

        STORAGE_HISTORY,

        JSON.stringify(historial)

    );

}

function agregarHistorial(url){

    if(url=="") return;

    historial=historial.filter(

        item=>item!==url

    );

    historial.unshift(url);

    if(historial.length>20){

        historial=historial.slice(0,20);

    }

    guardarHistorial();

    actualizarListaHistorial();

}

function actualizarListaHistorial(){

    const lista=document.getElementById("historyList");

    if(!lista) return;

    lista.innerHTML="";

    historial.forEach(url=>{

        const option=document.createElement("option");

        option.value=url;

        option.text=url;

        lista.appendChild(option);

    });

}

function cargarFavoritos(){

    favoritos=JSON.parse(

        localStorage.getItem(STORAGE_FAVORITES)

        ||"[]"

    );

}

function guardarFavoritos(){

    localStorage.setItem(

        STORAGE_FAVORITES,

        JSON.stringify(favoritos)

    );

}

function agregarFavorito(){

    const url=document

        .getElementById("stream_url")

        .value

        .trim();

    if(url=="") return;

    if(favoritos.includes(url))

        return;

    favoritos.push(url);

    guardarFavoritos();

    actualizarListaFavoritos();

}

function actualizarListaFavoritos(){

    const lista=document.getElementById("favoriteList");

    if(!lista) return;

    lista.innerHTML="";

    favoritos.forEach(url=>{

        const option=document.createElement("option");

        option.value=url;

        option.text=url;

        lista.appendChild(option);

    });

}

function cargarUltimaURL(){

    if(historial.length>0){

        document.getElementById("stream_url").value=

            historial[0];

    }

}

window.addEventListener(

    "load",

    function(){

        cargarHistorial();

        cargarFavoritos();

        actualizarListaHistorial();

        actualizarListaFavoritos();

        cargarUltimaURL();
